services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8787:8787"
    depends_on: [postgres, nats]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_system
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    restart: unless-stopped
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    restart: unless-stopped
volumes:
  postgres_data:
